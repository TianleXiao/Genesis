<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>传世锦囊</title>
    <style>
        :root {
            --china-red: #b32428;
            --gold: #d4af37;
            --silk-yellow: #f9d06b;
            --paper-white: #fcfaf2;
        }

        body {
            background: #1a1a1a;
            background-image: radial-gradient(#2c2c2c 1px, transparent 1px);
            background-size: 20px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: "Long Cang", "Ma Shan Zheng", cursive, serif;
            overflow: hidden;
            user-select: none;
        }

        /* --- 传统锦囊 UI 设计 --- */
        #pouch-wrapper {
            position: relative;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .jinnang {
            position: relative;
            width: 140px;
            height: 160px;
            background: var(--china-red);
            border-radius: 50% 50% 45% 45% / 40% 40% 60% 60%;
            border: 2px solid var(--gold);
            box-shadow: inset 0 -10px 20px rgba(0,0,0,0.4), 0 15px 30px rgba(0,0,0,0.6);
            transition: all 0.3s;
        }

        /* 锦囊上部的褶皱收口 */
        .jinnang::before {
            content: "";
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 40px;
            background: var(--china-red);
            border-radius: 50% 50% 0 0;
            border-top: 2px solid var(--gold);
            z-index: -1;
        }

        /* 金色束带 */
        .tie-belt {
            position: absolute;
            top: 35px;
            width: 150px;
            height: 12px;
            background: var(--gold);
            left: -5px;
            border-radius: 6px;
            z-index: 3;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            background-image: linear-gradient(90deg, transparent 50%, rgba(0,0,0,0.1) 50%);
            background-size: 4px 100%;
        }

        /* 流苏挂坠 */
        .tassel {
            position: absolute;
            bottom: -50px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 50px;
            background: var(--gold);
        }
        .tassel::after {
            content: "";
            position: absolute;
            bottom: -10px;
            left: -8px;
            width: 20px;
            height: 40px;
            background: repeating-linear-gradient(90deg, var(--gold), var(--gold) 2px, #b8860b 3px);
            border-radius: 0 0 5px 5px;
        }

        /* 暗纹装饰 */
        .cloud-pattern {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0.15;
            background-image: radial-gradient(circle at 50% 50%, var(--gold) 1px, transparent 10%);
            background-size: 20px 20px;
            pointer-events: none;
        }

        /* --- 交互动效 --- */
        .progress-circle {
            position: absolute;
            top: -20px;
            width: 180px;
            height: 180px;
            pointer-events: none;
        }

        circle {
            fill: none;
            stroke: var(--gold);
            stroke-width: 4;
            stroke-dasharray: 440;
            stroke-dashoffset: 440;
            transition: stroke-dashoffset 0.1s linear;
            transform: rotate(-90deg);
            transform-origin: center;
        }

        .shake-active {
            animation: ritualShake 0.6s infinite;
        }

        @keyframes ritualShake {
            0%, 100% { transform: rotate(0); }
            25% { transform: rotate(3deg) translateY(-5px); }
            75% { transform: rotate(-3deg) translateY(-2px); }
        }

        /* --- 弹窗与内容 --- */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(5px);
            z-index: 100;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .scroll-paper {
            background: var(--paper-white);
            background-image: url('https://www.transparenttextures.com/patterns/natural-paper.png');
            padding: 50px 30px;
            border: 2px solid #d4af37;
            box-shadow: 0 0 30px rgba(212,175,55,0.4);
            position: relative;
            max-width: 300px;
            transform: scale(0);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1);
        }

        .scroll-paper.show { transform: scale(1); }

        .vertical-text {
            writing-mode: vertical-rl;
            color: #222;
            font-size: 1.8rem;
            letter-spacing: 0.5rem;
            line-height: 1.5;
            text-align: center;
            margin: 0 auto;
            border-right: 1px dashed #ccc;
            padding-right: 15px;
        }

        .confirm-btn {
            margin-top: 30px;
            padding: 12px 40px;
            background: var(--china-red);
            color: var(--gold);
            border: 1px solid var(--gold);
            cursor: pointer;
            font-size: 1.1rem;
            letter-spacing: 2px;
        }

        .confirm-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    </style>
</head>
<body>

    <div id="pouch-wrapper">
        <!-- SVG Progress ring -->
        <svg class="progress-circle">
            <circle id="ring" cx="90" cy="90" r="70"></circle>
        </svg>

        <div class="jinnang" id="pouch-body">
            <div class="cloud-pattern"></div>
            <div class="tie-belt"></div>
            <div class="tassel"></div>
        </div>
        <p style="margin-top: 70px; color: var(--gold); letter-spacing: 3px;">虔心长按 · 启封妙计</p>
    </div>

    <!-- Step 1: Confirmation -->
    <div id="modal-confirm" class="modal">
        <h2 style="color: var(--gold); margin-bottom: 5px;">心存杂念，则灵犀不通</h2>
        <p id="countdown-msg" style="color: #888;">静候心平气和...</p>
        <button id="unlock-btn" class="confirm-btn" disabled onclick="revealTruth()">确认开启</button>
        <button class="confirm-btn" style="background:transparent; margin-top:10px;" onclick="reset()">闭门思过</button>
    </div>

    <!-- Step 2: Content -->
    <div id="modal-result" class="modal" onclick="reset()">
        <div class="scroll-paper" id="paper">
            <div class="vertical-text" id="final-text"></div>
            <p style="color: #999; font-size: 0.8rem; margin-top: 30px; text-align: center;">(点击任意处收起)</p>
        </div>
    </div>

    <script>
        // Use English comments in the code as requested
        let pressTimer;
        let offset = 440;
        const tips = ["返璞归真", "静以修身", "顺其自然", "虚怀若谷", "厚积薄发", "宁静致远", "守正出奇"];

        const pouch = document.getElementById('pouch-body');
        const ring = document.getElementById('ring');

        function startPress(e) {
            e.preventDefault();
            pouch.classList.add('shake-active');
            
            pressTimer = setInterval(() => {
                offset -= 11; // Approximately 4 seconds to fill
                ring.style.strokeDashoffset = offset;
                
                if (offset <= 0) {
                    clearInterval(pressTimer);
                    triggerConfirm();
                }
            }, 100);
        }

        function endPress() {
            if (offset > 0) {
                clearInterval(pressTimer);
                offset = 440;
                ring.style.strokeDashoffset = offset;
                pouch.classList.remove('shake-active');
            }
        }

        pouch.addEventListener('mousedown', startPress);
        pouch.addEventListener('touchstart', startPress);
        window.addEventListener('mouseup', endPress);
        window.addEventListener('touchend', endPress);

        function triggerConfirm() {
            pouch.classList.remove('shake-active');
            document.getElementById('modal-confirm').style.display = 'flex';
            
            let count = 3;
            const btn = document.getElementById('unlock-btn');
            const msg = document.getElementById('countdown-msg');
            
            const timer = setInterval(() => {
                count--;
                if (count > 0) {
                    msg.innerText = `沉思 ${count} 秒以示诚心...`;
                } else {
                    clearInterval(timer);
                    msg.innerText = "尘埃落定，妙计已现。";
                    btn.disabled = false;
                }
            }, 1000);
        }

        function revealTruth() {
            document.getElementById('modal-confirm').style.display = 'none';
            document.getElementById('modal-result').style.display = 'flex';
            document.getElementById('final-text').innerText = tips[Math.floor(Math.random() * tips.length)];
            
            setTimeout(() => {
                document.getElementById('paper').classList.add('show');
            }, 100);
        }

        function reset() {
            offset = 440;
            ring.style.strokeDashoffset = offset;
            document.querySelectorAll('.modal').forEach(m => m.style.display = 'none');
            document.getElementById('paper').classList.remove('show');
            document.getElementById('unlock-btn').disabled = true;
            document.getElementById('countdown-msg').innerText = "静候心平气和...";
        }
    </script>
</body>
</html>
