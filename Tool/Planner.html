<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eisenhower Matrix Manager</title>
    <style>
        /* Reset default margins and set up a dark, minimalist theme */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0a0a0a;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        /* Input section styling */
        .input-container {
            width: 100%;
            max-width: 800px;
            margin-bottom: 40px;
            position: relative;
        }

        #taskInput {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1px solid #333;
            color: #fff;
            font-size: 1.2rem;
            padding: 12px 5px;
            outline: none;
            transition: border-color 0.3s ease;
        }

        #taskInput:focus {
            border-bottom: 1px solid #fff;
        }

        .input-hint {
            font-size: 0.8rem;
            color: #666;
            margin-top: 8px;
            letter-spacing: 0.5px;
        }

        /* Matrix grid layout for the coordinate axis effect */
        .matrix-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            width: 100%;
            max-width: 1000px;
            height: 70vh;
            min-height: 600px;
            gap: 1px;
            background-color: #222; 
            border: 1px solid #222;
        }

        .quadrant {
            background-color: #0a0a0a;
            padding: 30px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .quadrant h2 {
            font-size: 0.9rem;
            font-weight: 500;
            color: #666;
            margin-bottom: 24px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        /* Subtle tone differences for headings to maintain minimalist hierarchy */
        #q1 h2 { color: #ffffff; } /* Important & Urgent */
        #q2 h2 { color: #aaaaaa; } /* Important & Not Urgent */
        #q3 h2 { color: #888888; } /* Not Important & Urgent */
        #q4 h2 { color: #555555; } /* Not Important & Not Urgent */

        ul {
            list-style: none;
            flex-grow: 1;
        }

        /* Task item styling */
        .task-item {
            display: flex;
            align-items: center;
            padding: 14px 12px;
            margin-bottom: 10px;
            background-color: #111111;
            border: 1px solid #1a1a1a;
            border-radius: 4px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            position: relative;
        }

        .task-item:hover {
            background-color: #161616;
            border-color: #333;
            transform: translateY(-1px);
        }

        /* Custom empty circle for completion toggle */
        .circle-btn {
            width: 16px;
            height: 16px;
            border: 1px solid #444;
            border-radius: 50%;
            margin-right: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            transition: all 0.2s ease;
        }

        .task-item:hover .circle-btn {
            border-color: #888;
        }

        .task-text {
            font-size: 0.95rem;
            color: #cccccc;
            transition: color 0.3s ease, text-decoration 0.3s ease;
            word-break: break-word;
            padding-right: 30px;
        }

        /* Premium minimalist delete button */
        .delete-btn {
            position: absolute;
            right: 15px;
            color: #444;
            font-size: 1.2rem;
            line-height: 1;
            cursor: pointer;
            opacity: 0;
            transition: all 0.2s ease;
        }

        .task-item:hover .delete-btn {
            opacity: 1;
        }

        .delete-btn:hover {
            color: #fff;
        }

        /* Completed state styling */
        .task-item.completed {
            background-color: #070707;
            border-color: #111;
        }

        .task-item.completed .circle-btn {
            background-color: #333;
            border-color: #333;
        }

        .task-item.completed .task-text {
            color: #444;
            text-decoration: line-through;
        }

        /* Custom scrollbar for minimalist look */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #222; border-radius: 2px; }
        ::-webkit-scrollbar-thumb:hover { background: #444; }
    </style>
</head>
<body>

    <div class="input-container">
        <input type="text" id="taskInput" placeholder="Enter task followed by a number (1-4)..." autocomplete="off">
        <div class="input-hint">Format: [Task Name] [1/2/3/4] &nbsp;&nbsp;&nbsp; Example: "Review quarterly budget 2"</div>
    </div>

    <div class="matrix-container">
        <div class="quadrant" id="q1">
            <h2>1. Important & Urgent</h2>
            <ul id="list-1"></ul>
        </div>
        <div class="quadrant" id="q2">
            <h2>2. Important & Not Urgent</h2>
            <ul id="list-2"></ul>
        </div>
        <div class="quadrant" id="q3">
            <h2>3. Urgent & Not Important</h2>
            <ul id="list-3"></ul>
        </div>
        <div class="quadrant" id="q4">
            <h2>4. Neither</h2>
            <ul id="list-4"></ul>
        </div>
    </div>

    <script>
        // Application state containing all tasks
        let tasks = [];

        // DOM Elements
        const taskInput = document.getElementById('taskInput');

        // Load tasks from LocalStorage on initial load
        document.addEventListener('DOMContentLoaded', () => {
            const savedTasks = localStorage.getItem('eisenhower_matrix_tasks');
            if (savedTasks) {
                tasks = JSON.parse(savedTasks);
                renderAllTasks();
            }
        });

        // Sync the current state to LocalStorage
        function saveTasksToLocalStorage() {
            localStorage.setItem('eisenhower_matrix_tasks', JSON.stringify(tasks));
        }

        // Completely render all tasks from the global state array
        function renderAllTasks() {
            // Clear existing lists in all quadrants
            for (let i = 1; i <= 4; i++) {
                document.getElementById(`list-${i}`).innerHTML = '';
            }

            // Iterate and build DOM nodes for each task
            tasks.forEach(task => {
                const targetList = document.getElementById(`list-${task.quadrant}`);
                if (!targetList) return;

                const li = document.createElement('li');
                li.className = `task-item ${task.completed ? 'completed' : ''}`;
                
                const circleBtn = document.createElement('div');
                circleBtn.className = 'circle-btn';

                const textSpan = document.createElement('span');
                textSpan.className = 'task-text';
                textSpan.textContent = task.text;

                const deleteBtn = document.createElement('div');
                deleteBtn.className = 'delete-btn';
                deleteBtn.innerHTML = '&times;';

                // Handle task completion toggle
                li.addEventListener('click', (e) => {
                    if (e.target.classList.contains('delete-btn')) return;
                    task.completed = !task.completed;
                    saveTasksToLocalStorage();
                    renderAllTasks();
                });

                // Handle task deletion
                deleteBtn.addEventListener('click', (e) => {
                    e.stopPropagation(); // Prevent the li click event from triggering
                    tasks = tasks.filter(t => t.id !== task.id);
                    saveTasksToLocalStorage();
                    renderAllTasks();
                });

                li.appendChild(circleBtn);
                li.appendChild(textSpan);
                li.appendChild(deleteBtn);
                targetList.appendChild(li);
            });
        }

        // Listen for the Enter key to capture and route new tasks
        taskInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                const inputText = this.value.trim();
                if (!inputText) return;

                // Extract the final character to classify the quadrant
                const lastChar = inputText.slice(-1);
                
                if (['1', '2', '3', '4'].includes(lastChar)) {
                    const taskName = inputText.slice(0, -1).trim();
                    if (taskName) {
                        // Create a unique task object
                        const newTask = {
                            id: Date.now().toString() + Math.random().toString(36).substr(2, 5),
                            text: taskName,
                            quadrant: parseInt(lastChar),
                            completed: false
                        };
                        
                        tasks.push(newTask);
                        saveTasksToLocalStorage();
                        renderAllTasks();
                        
                        // Clear input field
                        this.value = '';
                    } else {
                        alert("Please enter a valid task name before the number.");
                    }
                } else {
                    alert("Please end your task with a number from 1 to 4 to categorize it.");
                }
            }
        });
    </script>
</body>
</html>
