<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Random Picker</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --card-bg: #141414;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --accent: #ffffff;
            --border: #262626;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Background texture */
        body::before {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(#262626 1px, transparent 1px);
            background-size: 40px 40px;
            opacity: 0.3;
            z-index: -1;
        }

        .container {
            background: var(--card-bg);
            padding: 3rem;
            border-radius: 24px;
            border: 1px solid var(--border);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--text-secondary);
            margin-bottom: 2rem;
        }

        .result-display {
            font-size: 5rem;
            font-weight: 700;
            margin: 1.5rem 0;
            height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-variant-numeric: tabular-nums;
        }

        .input-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .input-field {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        input {
            width: 100%;
            background: #1a1a1a;
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 8px;
            color: white;
            outline: none;
            transition: var(--transition);
        }

        input:focus {
            border-color: var(--accent);
            background: #222;
        }

        button {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: none;
            background: var(--accent);
            color: black;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -10px rgba(255, 255, 255, 0.4);
            filter: brightness(0.9);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
            transform: none;
        }

        .history {
            margin-top: 2rem;
            font-size: 0.875rem;
            color: var(--text-secondary);
            border-top: 1px solid var(--border);
            padding-top: 1.5rem;
        }

        .history-list {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 0.5rem;
            flex-wrap: wrap;
        }

        .history-item {
            opacity: 0.5;
            font-size: 0.75rem;
        }

        /* Rolling animation */
        .rolling {
            animation: pulse 0.1s infinite;
            filter: blur(2px);
        }

        @keyframes pulse {
            0% { transform: translateY(0); }
            50% { transform: translateY(-2px); }
            100% { transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Random Picker</h1>
        
        <div class="result-display" id="result">0</div>

        <div class="input-group">
            <div class="input-field">
                <label>MIN</label>
                <input type="number" id="minRange" value="1">
            </div>
            <div class="input-field">
                <label>MAX</label>
                <input type="number" id="maxRange" value="100">
            </div>
        </div>

        <button id="generateBtn">GENERATE</button>

        <div class="history">
            <label>RECENT</label>
            <div class="history-list" id="historyList">
                <!-- History items will be added here -->
            </div>
        </div>
    </div>

    <script>
        const resultEl = document.getElementById('result');
        const minInput = document.getElementById('minRange');
        const maxInput = document.getElementById('maxRange');
        const generateBtn = document.getElementById('generateBtn');
        const historyList = document.getElementById('historyList');

        let history = [];

        function generateRandom() {
            const min = parseInt(minInput.value);
            const max = parseInt(maxInput.value);

            if (min >= max) {
                alert('Min must be less than Max');
                return;
            }

            // UI Feedback: Start rolling effect
            generateBtn.disabled = true;
            resultEl.classList.add('rolling');
            
            let duration = 800; // 0.8 seconds animation
            let startTime = Date.now();

            const timer = setInterval(() => {
                const tempRandom = Math.floor(Math.random() * (max - min + 1)) + min;
                resultEl.innerText = tempRandom;

                if (Date.now() - startTime > duration) {
                    clearInterval(timer);
                    finalizeSelection(min, max);
                }
            }, 50);
        }

        function finalizeSelection(min, max) {
            const finalNum = Math.floor(Math.random() * (max - min + 1)) + min;
            resultEl.innerText = finalNum;
            resultEl.classList.remove('rolling');
            generateBtn.disabled = false;

            // Add to history
            updateHistory(finalNum);
        }

        function updateHistory(num) {
            history.unshift(num);
            if (history.length > 5) history.pop();

            historyList.innerHTML = history
                .map(n => `<span class="history-item">${n}</span>`)
                .join('');
        }

        generateBtn.addEventListener('click', generateRandom);

        // Allow Enter key to trigger
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') generateRandom();
        });
    </script>
</body>
</html>
