<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Acronym & Random Grouper</title>
    <script src="https://unpkg.com/pinyin-pro@3.18.3/dist/index.js"></script>
    <style>
        :root {
            --bg: #050505;
            --surface: #111111;
            --surface-sub: #1a1a1a;
            --border: #222222;
            --text-main: #ffffff;
            --text-dim: #666666;
            --accent: #ffffff;
            --ease: cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px 24px;
        }

        body::before {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(#151515 1px, transparent 1px);
            background-size: 24px 24px;
            opacity: 0.8;
            z-index: -1;
        }

        .card {
            background: var(--surface);
            width: 100%;
            max-width: 800px;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.8);
        }

        header {
            margin-bottom: 32px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .label-tiny {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.25em;
            color: var(--text-dim);
            text-transform: uppercase;
            margin-bottom: 8px;
            display: block;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 300;
            letter-spacing: -0.02em;
        }

        .version {
            font-size: 10px;
            background: var(--border);
            color: var(--text-dim);
            padding: 2px 6px;
            border-radius: 4px;
        }

        .input-box-wrapper {
            margin-bottom: 24px;
        }

        textarea {
            width: 100%;
            height: 110px;
            background: var(--surface-sub);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            color: var(--text-main);
            font-size: 0.95rem;
            line-height: 1.6;
            outline: none;
            resize: none;
            transition: var(--ease) 0.3s;
        }

        textarea:focus { border-color: var(--text-dim); }

        .drop-zone {
            border: 1px dashed var(--border);
            border-radius: 8px;
            padding: 16px;
            text-align: center;
            background: #090909;
            cursor: pointer;
            transition: var(--ease) 0.3s;
            margin-bottom: 24px;
        }

        .drop-zone:hover { border-color: var(--text-main); }
        .drop-zone p { font-size: 0.85rem; color: var(--text-dim); }
        #fileInput { display: none; }

        /* Control Panel for Grouping */
        .config-panel {
            background: #090909;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 32px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .config-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .radio-wrapper {
            display: flex;
            gap: 16px;
            margin-bottom: 4px;
        }

        .radio-label {
            font-size: 0.85rem;
            color: var(--text-dim);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .radio-label input:checked + span {
            color: var(--text-main);
        }

        .num-input {
            width: 100%;
            background: var(--surface-sub);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px 12px;
            color: var(--text-main);
            font-size: 0.9rem;
            outline: none;
        }

        .num-input:focus { border-color: var(--text-dim); }

        .output-section {
            background: #090909;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 24px;
        }

        .output-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
            margin-bottom: 16px;
            gap: 20px;
        }

        .search-wrapper {
            position: relative;
            flex-grow: 1;
            max-width: 260px;
        }

        .search-input {
            width: 100%;
            background: var(--surface-sub);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 6px 12px;
            color: var(--text-main);
            font-size: 0.85rem;
            outline: none;
        }

        /* Group Layout Grid */
        .groups-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .group-box {
            background: var(--surface-sub);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
        }

        .group-title {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-dim);
            border-bottom: 1px solid var(--border);
            padding-bottom: 6px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
        }

        .member-item {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            padding: 4px 0;
            transition: opacity 0.2s;
        }

        .member-item.dimmed {
            opacity: 0.15;
        }

        .name-tag { color: var(--text-main); }
        .acronym-tag {
            font-family: monospace;
            font-weight: 700;
            color: var(--text-dim);
        }

        .action-bar {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            border-top: 1px solid var(--border);
            padding-top: 20px;
        }

        .btn {
            background: var(--text-main);
            color: var(--bg);
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--ease) 0.2s;
        }

        .btn:hover { background: #e5e5e5; }
        .btn-secondary { background: transparent; color: var(--text-dim); border: 1px solid var(--border); }
        .btn-secondary:hover { color: var(--text-main); border-color: var(--text-dim); background: var(--surface-sub); }

        .empty-prompt { text-align: center; color: #222; padding: 40px 0; font-size: 0.9rem; font-weight: 600; }
        .groups-container::-webkit-scrollbar { width: 4px; }
        .groups-container::-webkit-scrollbar-thumb { background: var(--border); }
    </style>
</head>
<body>

    <div class="card">
        <header>
            <div>
                <span class="label-tiny">Dynamic Extraction & Placement</span>
                <h1>Acronym Studio & Random Grouper</h1>
            </div>
            <span class="version">v7.0 Hybrid</span>
        </header>

        <div class="input-box-wrapper">
            <span class="label-tiny">1. Paste raw text / 粘贴任意原始文本</span>
            <textarea id="rawTextArea" placeholder="在此粘贴包含大量人名的文本，系统会自动精准解析名单并锁定拼音缩写..."></textarea>
        </div>

        <div class="drop-zone" id="dropZone">
            <p>或者将文件拖拽至此 (支持 .txt, .csv, .md) 📂</p>
            <input type="file" id="fileInput" accept=".txt,.csv,.md">
        </div>

        <div class="config-panel">
            <div class="config-group">
                <span class="label-tiny">2. Grouping Mode / 分组模式选择</span>
                <div class="radio-wrapper">
                    <label class="radio-label">
                        <input type="radio" name="groupMode" value="bySize" checked onchange="toggleModeInput()">
                        <span>按每组人数分</span>
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="groupMode" value="byCount" onchange="toggleModeInput()">
                        <span>固定划分为几组</span>
                    </label>
                </div>
            </div>
            <div class="config-group">
                <span class="label-tiny" id="numInputLabel">Parameters / 每组目标人数</span>
                <input type="number" id="modeValueInput" class="num-input" value="3" min="1" oninput="executeGrouping()">
            </div>
        </div>

        <div class="output-section">
            <div class="output-header">
                <span class="label-tiny" id="statusCount">Detected: 0 Names</span>
                <div class="search-wrapper" id="searchWrapper" style="display: none;">
                    <input type="text" id="searchInput" class="search-input" placeholder="输入缩写过滤定位人名 (如: ZSF)..." autocomplete="off">
                </div>
            </div>
            
            <div id="resultsWrapper" style="display: none;">
                <div class="groups-container" id="groupsGrid"></div>
                
                <div class="action-bar">
                    <button class="btn" onclick="executeGrouping()">⚡ 重新随机洗牌分组</button>
                    <button class="btn btn-secondary" onclick="copyGroupsResult()">复制分组对照表</button>
                    <button class="btn btn-secondary" onclick="exportGroupsTXT()">导出分组 TXT</button>
                </div>
            </div>

            <div id="emptyPrompt" class="empty-prompt">AWAITING SOURCE TEXT</div>
        </div>
    </div>

    <script>
        const surnames = "赵钱孙李周吴郑王冯陈褚卫蒋沈韩杨朱秦尤许何吕施张孔曹严华金魏陶姜戚谢邹喻柏水章云苏潘葛奚范彭郎鲁韦昌马苗凤花方俞任袁柳酆鲍史唐费廉岑薛雷贺倪汤滕殷罗毕郝邬安常乐于时傅皮卞齐康伍余元卜顾孟平黄和穆萧尹姚邵湛汪祁毛禹狄米贝明臧计伏成戴谈宋茅庞熊纪舒屈项祝董梁杜阮蓝闵席季麻强贾路娄危江童颜郭梅盛林刁钟徐邱骆高夏蔡田樊胡凌霍虞万支柯昝管卢莫经房裘缪干解应宗丁宣贲邓郁单杭洪包诸左石崔吉纽龚程嵇邢滑裴陆荣翁荀羊於惠甄麹家封芮羿储靳汲邴糜松井段富巫乌焦巴弓牧隗山谷车侯宓蓬全郗班仰秋仲伊宫宁仇栾暴甘钭厉戎祖武符刘景詹束龙叶幸司韶郜黎蓟薄印宿白怀蒲邰从鄂索咸籍赖卓蔺屠蒙池乔阴鬱胥能苍双闻莘党翟谭贡劳逄姬申扶堵冉宰郦雍郤璩桑桂濮牛寿通边扈燕冀郏浦尚农温别庄晏柴瞿阎充慕连茹习宦艾鱼容向古易慎戈廖庾终暨居衡步都耿满弘匡国文寇广禄阙东欧欧阳太史端木闾丘司马独孤夏侯诸葛尉迟公羊赫连澹台皇甫宗政濮阳卓文";

        // --- Core Pinyin Generator (ZH/CH/SH -> Z/C/S) ---
        function generateAcronym(name) {
            if (typeof pinyinPro !== 'undefined') {
                const initialsArray = pinyinPro.pinyin(name, { pattern: 'initial', toneType: 'none', type: 'array' });
                return initialsArray.map(initial => {
                    let upper = initial.toUpperCase();
                    if (upper === 'ZH') return 'Z';
                    if (upper === 'CH') return 'C';
                    if (upper === 'SH') return 'S';
                    return upper || '?';
                }).join('');
            }
            return [...name].map(char => char.charAt(0).toUpperCase()).join('');
        }

        // --- Core Name Extraction Engine ---
        function extractNames(text) {
            if (!text) return [];
            const extracted = [];
            const len = text.length;
            let i = 0;

            while (i < len) {
                let isMatch = false;
                if (i <= len - 3) {
                    const word3 = text.substr(i, 3);
                    if (isValidName(word3, 3)) {
                        extracted.push(word3);
                        i += 3;
                        isMatch = true;
                    }
                }
                if (!isMatch && i <= len - 2) {
                    const word2 = text.substr(i, 2);
                    if (isValidName(word2, 2)) {
                        extracted.push(word2);
                        i += 2;
                        isMatch = true;
                    }
                }
                if (!isMatch) i++;
            }

            const uniqueNames = [...new Set(extracted)];
            return uniqueNames.filter(name => {
                if (name.length === 2) {
                    return !uniqueNames.some(longerName => longerName.length === 3 && longerName.includes(name));
                }
                return true;
            });
        }

        function isValidName(word, length) {
            if (!/^[\u4e00-\u9fa5]+$/.test(word)) return false;
            return surnames.includes(word.charAt(0)) || (length === 3 && surnames.includes(word.substr(0, 2)));
        }

        // --- UI & Application State ---
        const rawTextArea = document.getElementById('rawTextArea');
        const resultsWrapper = document.getElementById('resultsWrapper');
        const emptyPrompt = document.getElementById('emptyPrompt');
        const groupsGrid = document.getElementById('groupsGrid');
        const statusCount = document.getElementById('statusCount');
        const searchWrapper = document.getElementById('searchWrapper');
        const searchInput = document.getElementById('searchInput');
        const numInputLabel = document.getElementById('numInputLabel');
        const modeValueInput = document.getElementById('modeValueInput');

        let parsedMembers = []; // Store array: [{name, acronym}]
        let currentGroupResult = []; // Store array of arrays: [[{name, acronym}, ...], ...]

        // Dynamic parameters toggle switcher
        function toggleModeInput() {
            const mode = document.querySelector('input[name="groupMode"]:checked').value;
            if (mode === 'bySize') {
                numInputLabel.innerText = "Parameters / 每组目标人数";
                modeValueInput.value = 3;
            } else {
                numInputLabel.innerText = "Parameters / 固定划分为几组";
                modeValueInput.value = 4;
            }
            executeGrouping();
        }

        rawTextArea.addEventListener('input', () => {
            const names = extractNames(rawTextArea.value);
            parsedMembers = names.map(n => ({ name: n, acronym: generateAcronym(n) }));
            
            if (parsedMembers.length === 0) {
                resultsWrapper.style.display = 'none';
                searchWrapper.style.display = 'none';
                emptyPrompt.style.display = 'block';
                statusCount.innerText = "Detected: 0 Names";
                return;
            }
            
            emptyPrompt.style.display = 'none';
            resultsWrapper.style.display = 'block';
            searchWrapper.style.display = 'block';
            executeGrouping();
        });

        // --- Random Shuffler & Allocation Logic ---
        function executeGrouping() {
            if (parsedMembers.length === 0) return;
            searchInput.value = ''; // Reset search filter on reshuffle

            // 1. Copy and Shuffle using Fisher-Yates algorithm
            let shuffled = [...parsedMembers];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }

            const mode = document.querySelector('input[name="groupMode"]:checked').value;
            let val = parseInt(modeValueInput.value) || 1;
            if (val < 1) val = 1;

            currentGroupResult = [];

            if (mode === 'bySize') {
                // Mode A: Fixed group size allocation
                for (let i = 0; i < shuffled.length; i += val) {
                    currentGroupResult.push(shuffled.slice(i, i + val));
                }
            } else {
                // Mode B: Fixed total number of groups allocation
                if (val > shuffled.length) val = shuffled.length;
                for (let i = 0; i < val; i++) {
                    currentGroupResult.push([]);
                }
                shuffled.forEach((member, index) => {
                    currentGroupResult[index % val].push(member);
                });
            }

            renderGroups(currentGroupResult);
        }

        // Render grouping result inside interactive card panel
        function renderGroups(groups, filterQuery = '') {
            statusCount.innerText = `Total Extracted: ${parsedMembers.length} Names / Divided into ${groups.length} Groups`;
            groupsGrid.innerHTML = '';

            groups.forEach((group, index) => {
                const groupBox = document.createElement('div');
                groupBox.className = 'group-box';
                
                groupBox.innerHTML = `
                    <div class="group-title">
                        <span>GROUP ${String(index + 1).padStart(2, '0')}</span>
                        <span>(${group.length}人)</span>
                    </div>
                `;

                group.forEach(member => {
                    const memberDiv = document.createElement('div');
                    memberDiv.className = 'member-item';
                    
                    // Live search fallback filtering
                    if (filterQuery && !member.acronym.includes(filterQuery)) {
                        memberDiv.classList.add('dimmed');
                    }

                    memberDiv.innerHTML = `
                        <span class="name-tag">${member.name}</span>
                        <span class="acronym-tag">${member.acronym}</span>
                    `;
                    groupBox.appendChild(memberDiv);
                });

                groupsGrid.appendChild(groupBox);
            });
        }

        // --- Live Search Input Interface Listener ---
        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.trim().toUpperCase();
            renderGroups(currentGroupResult, query);
        });

        // File Operations Interfacing
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');

        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.style.borderColor = 'var(--text-main)'; });
        dropZone.addEventListener('dragleave', () => dropZone.style.borderColor = 'var(--border)');
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = 'var(--border)';
            if(e.dataTransfer.files.length > 0) loadFile(e.dataTransfer.files[0]);
        });
        fileInput.addEventListener('change', (e) => {
            if(e.target.files.length > 0) loadFile(e.target.files[0]);
        });

        function loadFile(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                rawTextArea.value = e.target.result;
                rawTextArea.dispatchEvent(new Event('input'));
            };
            reader.readAsText(file);
        }

        // Generating plain text formatted table content for export
        function formatGroupsText() {
            return currentGroupResult.map((group, idx) => {
                let str = `--- 第 ${idx + 1} 组 (${group.length}人) ---\n`;
                str += group.map(m => `${m.name}\t[${m.acronym}]`).join('\n');
                return str;
            }).join('\n\n');
        }

        function copyGroupsResult() {
            if (currentGroupResult.length === 0) return;
            navigator.clipboard.writeText(formatGroupsText())
                .then(() => alert('分组对照表已复制到剪贴板'))
                .catch(() => alert('复制失败'));
        }

        function exportGroupsTXT() {
            if (currentGroupResult.length === 0) return;
            const blob = new Blob([formatGroupsText()], { type: 'text/plain;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = url;
            link.download = `random_groups_${Date.now()}.txt`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
