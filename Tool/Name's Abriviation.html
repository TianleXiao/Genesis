<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Acronym Studio - Simplified Initials</title>
    <script src="https://unpkg.com/pinyin-pro@3.18.3/dist/index.js"></script>
    <style>
        :root {
            --bg: #050505;
            --surface: #111111;
            --surface-sub: #1a1a1a;
            --border: #222222;
            --text-main: #ffffff;
            --text-dim: #666666;
            --accent: #ffffff;
            --ease: cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px 24px;
        }

        body::before {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(#151515 1px, transparent 1px);
            background-size: 24px 24px;
            opacity: 0.8;
            z-index: -1;
        }

        .card {
            background: var(--surface);
            width: 100%;
            max-width: 720px;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.8);
        }

        header {
            margin-bottom: 32px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .label-tiny {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.25em;
            color: var(--text-dim);
            text-transform: uppercase;
            margin-bottom: 8px;
            display: block;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 300;
            letter-spacing: -0.02em;
        }

        .version {
            font-size: 10px;
            background: var(--border);
            color: var(--text-dim);
            padding: 2px 6px;
            border-radius: 4px;
        }

        .input-box-wrapper {
            margin-bottom: 24px;
        }

        textarea {
            width: 100%;
            height: 130px;
            background: var(--surface-sub);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            color: var(--text-main);
            font-size: 0.95rem;
            line-height: 1.6;
            outline: none;
            resize: none;
            transition: var(--ease) 0.3s;
        }

        textarea:focus {
            border-color: var(--text-dim);
        }

        .drop-zone {
            border: 1px dashed var(--border);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            background: #090909;
            cursor: pointer;
            transition: var(--ease) 0.3s;
            margin-bottom: 32px;
        }

        .drop-zone:hover, .drop-zone.dragover {
            border-color: var(--text-main);
            background: var(--surface-sub);
        }

        .drop-zone p {
            font-size: 0.85rem;
            color: var(--text-dim);
        }

        #fileInput { display: none; }

        .output-section {
            background: #090909;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 24px;
        }

        .output-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
            margin-bottom: 16px;
            gap: 20px;
        }

        .search-wrapper {
            position: relative;
            flex-grow: 1;
            max-width: 300px;
        }

        .search-input {
            width: 100%;
            background: var(--surface-sub);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px 12px;
            color: var(--text-main);
            font-size: 0.85rem;
            outline: none;
            transition: var(--ease) 0.3s;
        }

        .search-input:focus {
            border-color: var(--text-dim);
            background: #202022;
        }

        .result-grid-header {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            padding: 0 12px 8px 12px;
            font-size: 11px;
            color: var(--text-dim);
            border-bottom: 1px solid var(--border);
        }

        .results-container {
            max-height: 260px;
            overflow-y: auto;
        }

        .result-row {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            padding: 12px;
            border-bottom: 1px solid #161616;
            font-size: 0.9rem;
            align-items: center;
        }

        .result-row:last-child { border-bottom: none; }
        
        .name-tag {
            font-weight: 400;
            color: var(--text-main);
        }

        .acronym-tag {
            font-family: 'Courier New', Courier, monospace;
            font-weight: 700;
            letter-spacing: 0.05em;
            color: #d4d4d4;
        }

        .action-bar {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            border-top: 1px solid var(--border);
            padding-top: 20px;
        }

        .btn {
            background: var(--text-main);
            color: var(--bg);
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: var(--ease) 0.2s;
        }

        .btn:hover { background: #e5e5e5; }
        
        .btn-secondary {
            background: transparent;
            color: var(--text-dim);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            color: var(--text-main);
            border-color: var(--text-dim);
            background: var(--surface-sub);
        }

        .empty-prompt {
            text-align: center;
            color: #222;
            padding: 40px 0;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .results-container::-webkit-scrollbar { width: 4px; }
        .results-container::-webkit-scrollbar-thumb { background: var(--border); }
    </style>
</head>
<body>

    <div class="card">
        <header>
            <div>
                <span class="label-tiny">Text Analysis Engine</span>
                <h1>Acronym Studio Ultra Max</h1>
            </div>
            <span class="version">v6.2 Single-Letter Initials</span>
        </header>

        <div class="input-box-wrapper">
            <span class="label-tiny">Paste raw text / 粘贴任意文本</span>
            <textarea id="rawTextArea" placeholder="输入或粘贴包含汉字人名的文本，系统自动识别。已应用zh/ch/sh自动简写为z/c/s逻辑..."></textarea>
        </div>

        <div class="drop-zone" id="dropZone">
            <p>或者将文件拖拽至此 (支持 .txt, .csv, .md) 📂</p>
            <input type="file" id="fileInput" accept=".txt,.csv,.md">
        </div>

        <div class="output-section">
            <div class="output-header">
                <span class="label-tiny" id="statusCount">Detected: 0 Names</span>
                <div class="search-wrapper" id="searchWrapper" style="display: none;">
                    <input type="text" id="searchInput" class="search-input" placeholder="输入缩写快速查人名 (如: ZSF)..." autocomplete="off">
                </div>
            </div>
            
            <div id="resultsWrapper" style="display: none;">
                <div class="result-grid-header">
                    <span>EXTRACTED NAME</span>
                    <span>ACRONYM</span>
                </div>
                <div class="results-container" id="resultsList"></div>
                
                <div class="action-bar">
                    <button class="btn" onclick="copyResults()">复制对照表</button>
                    <button class="btn btn-secondary" onclick="exportTXT()">导出 TXT</button>
                </div>
            </div>

            <div id="emptyPrompt" class="empty-prompt">AWAITING INPUT</div>
        </div>
    </div>

    <script>
        // High-precision surname library for extraction validation
        const surnames = "赵钱孙李周吴郑王冯陈褚卫蒋沈韩杨肖朱秦尤许何吕施张孔曹严华金魏陶姜戚谢邹喻柏水章云苏潘葛奚范彭郎鲁韦昌马苗凤花方俞任袁柳酆鲍史唐费廉岑薛雷贺倪汤滕殷罗毕郝邬安常乐于时傅皮卞齐康伍余元卜顾孟平黄和穆萧尹姚邵湛汪祁毛禹狄米贝明臧计伏成戴谈宋茅庞熊纪舒屈项祝董梁杜阮蓝闵席季麻强贾路娄危江童颜郭梅盛林刁钟徐邱骆高夏蔡田樊胡凌霍虞万支柯昝管卢莫经房裘缪干解应宗丁宣贲邓郁单杭洪包诸左石崔吉纽龚程嵇邢滑裴陆荣翁荀羊於惠甄麹家封芮羿储靳汲邴糜松井段富巫乌焦巴弓牧隗山谷车侯宓蓬全郗班仰秋仲伊宫宁仇栾暴甘钭厉戎祖武符刘景詹束龙叶幸司韶郜黎蓟薄印宿白怀蒲邰从鄂索咸籍赖卓蔺屠蒙池乔阴鬱胥能苍双闻莘党翟谭贡劳逄姬申扶堵冉宰郦雍郤璩桑桂濮牛寿通边扈燕冀郏浦尚农温别庄晏柴瞿阎充慕连茹习宦艾鱼容向古易慎戈廖庾终暨居衡步都耿满弘匡国文寇广禄阙东欧欧阳太史端木闾丘司马独孤夏侯诸葛尉迟公羊赫连澹台皇甫宗政濮阳卓文";

        // --- Core Pronym Generator with Custom Simplified Rule ---
        function generateAcronym(name) {
            if (typeof pinyinPro !== 'undefined') {
                // Get full initials using the library (e.g., "张三丰" -> ["zh", "s", "f"])
                const initialsArray = pinyinPro.pinyin(name, { pattern: 'initial', toneType: 'none', type: 'array' });
                
                return initialsArray.map(initial => {
                    let upper = initial.toUpperCase();
                    // Process rule: Convert ZH->Z, CH->C, SH->S
                    if (upper === 'ZH') return 'Z';
                    if (upper === 'CH') return 'C';
                    if (upper === 'SH') return 'S';
                    return upper || '?';
                }).join('');
            } else {
                // Hard-coded basic fallback if CDN drops out
                return [...name].map(char => char.charAt(0).toUpperCase()).join('');
            }
        }

        // --- Optimized Name Extraction Engine ---
        function extractNames(text) {
            if (!text) return [];
            const extracted = [];
            const len = text.length;
            let i = 0;

            // 1. Forward Maximum Matching Engine
            while (i < len) {
                let isMatch = false;
                if (i <= len - 3) {
                    const word3 = text.substr(i, 3);
                    if (isValidName(word3, 3)) {
                        extracted.push(word3);
                        i += 3;
                        isMatch = true;
                    }
                }
                if (!isMatch && i <= len - 2) {
                    const word2 = text.substr(i, 2);
                    if (isValidName(word2, 2)) {
                        extracted.push(word2);
                        i += 2;
                        isMatch = true;
                    }
                }
                if (!isMatch) i++;
            }

            // 2. Strict Length-Priority Deduplication
            const uniqueNames = [...new Set(extracted)];
            return uniqueNames.filter(name => {
                if (name.length === 2) {
                    const hasLongerOverlap = uniqueNames.some(longerName => 
                        longerName.length === 3 && longerName.includes(name)
                    );
                    return !hasLongerOverlap;
                }
                return true;
            });
        }

        function isValidName(word, length) {
            if (!/^[\u4e00-\u9fa5]+$/.test(word)) return false;
            const firstChar = word.charAt(0);
            return surnames.includes(firstChar) || (length === 3 && surnames.includes(word.substr(0, 2)));
        }

        // --- UI Logic & Controller ---
        const rawTextArea = document.getElementById('rawTextArea');
        const resultsWrapper = document.getElementById('resultsWrapper');
        const emptyPrompt = document.getElementById('emptyPrompt');
        const resultsList = document.getElementById('resultsList');
        const statusCount = document.getElementById('statusCount');
        const searchWrapper = document.getElementById('searchWrapper');
        const searchInput = document.getElementById('searchInput');

        let finalActiveData = []; 

        rawTextArea.addEventListener('input', () => {
            processRawText(rawTextArea.value);
        });

        function processRawText(text) {
            const names = extractNames(text);
            finalActiveData = names.map(n => ({ name: n, acronym: generateAcronym(n) }));
            
            searchInput.value = '';

            if (finalActiveData.length === 0) {
                resultsWrapper.style.display = 'none';
                searchWrapper.style.display = 'none';
                emptyPrompt.style.display = 'block';
                statusCount.innerText = "Detected: 0 Names";
                return;
            }

            emptyPrompt.style.display = 'none';
            resultsWrapper.style.display = 'block';
            searchWrapper.style.display = 'block';
            
            renderList(finalActiveData);
        }

        function renderList(data) {
            statusCount.innerText = `Detected: ${data.length} / ${finalActiveData.length} Names`;
            resultsList.innerHTML = data.map(item => `
                <div class="result-row">
                    <span class="name-tag">${item.name}</span>
                    <span class="acronym-tag">${item.acronym}</span>
                </div>
            `).join('');
        }

        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.trim().toUpperCase();
            if (!query) {
                renderList(finalActiveData);
                return;
            }
            const filteredData = finalActiveData.filter(item => item.acronym.includes(query));
            renderList(filteredData);
        });

        // File Operations Section
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');

        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if(e.dataTransfer.files.length > 0) loadFile(e.dataTransfer.files[0]);
        });
        fileInput.addEventListener('change', (e) => {
            if(e.target.files.length > 0) loadFile(e.target.files[0]);
        });

        function loadFile(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                rawTextArea.value = e.target.result;
                processRawText(e.target.result);
            };
            reader.readAsText(file);
        }

        function copyResults() {
            const copyText = finalActiveData.map(item => `${item.name}\t${item.acronym}`).join('\n');
            navigator.clipboard.writeText(copyText).then(() => alert('对照表复制成功')).catch(() => alert('复制失败'));
        }

        function exportTXT() {
            const outputText = finalActiveData.map(item => `${item.name}\t${item.acronym}`).join('\n');
            const blob = new Blob([outputText], { type: 'text/plain;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = url;
            link.download = `acronym_export_${Date.now()}.txt`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
